[project]
name = "consolidated-ontology-suite-python"
version = "0.1.0"
description = "Assess OWL2 DL/RL/QL ontologies, TARQL/oxi-gen CONSTRUCT-query sketches, and the RDF data graphs they triplify -- structural, logical, documentation, efficiency, style, data quality, OWL2 profile membership, and reasoner-based consistency -- plus ontology-version and TARQL/ontology consistency checking with suggested repair diffs, locally or against a live Fuseki triplestore."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.6.0",
    "pyshacl>=0.25.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
    "owlrl>=6.0.2",
    "owlready2>=0.51",
]

[project.optional-dependencies]
reasoner = [
    "owlready2>=0.47",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ontology-suite = "ontology_suite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontology_suite"]
