[project]
name = "ontology-quality-suite"
version = "0.25.0"
description = "Ontology Quality Suite -- assess OWL2 DL/RL/QL ontologies, TARQL/oxi-gen CONSTRUCT-query sketches, and the RDF data graphs they triplify -- structural, logical, documentation, efficiency, style, data quality, OWL2 profile membership, and reasoner-based consistency -- plus ontology-version and TARQL/ontology consistency checking with suggested repair diffs, locally or against a live Fuseki triplestore."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.11"
authors = [{ name = "pwin", email = "pw@inbox.lv" }]
keywords = ["rdf", "owl", "shacl", "sparql", "ontology", "tarql", "semantic-web", "linked-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # rdflib parses, holds graphs and holds results. It no longer evaluates
    # anything: SPARQL is holosdb's job and SHACL is the `shacl` engine's. The
    # direction of travel is for those two to take the remaining jobs as well
    # -- see "Which engine does the work" in docs/ARCHITECTURE.md.
    "rdflib>=7.6.0",
    # The SPARQL engine the portable .rq checks run on. A runtime dependency
    # rather than an option: rdflib's leniency let a check pass here and fail
    # in the field, so there is one engine and it is the conformant one. See
    # checks/holos_sparql.py.
    # >=0.23 because the previous floor, >=0.15, was far below anything this
    # suite can actually run on and would have let a clean install resolve an
    # unusable environment. It is not a performance floor: 0.23.0 unified
    # `Engine::query`, which checks/holos_sparql.py calls, with the
    # `query_with` pipeline it had drifted from, and on this suite's own
    # checks against examples/acme_robotics that is a wash -- 1989 ms against
    # 2025 ms, three runs each, with byte-identical findings.
    #
    # One measured caveat for whoever runs this on a large graph. The 0.23
    # plan uses a filter's constants as bindings, which helps a selective
    # filter and hurts an unselective one. On 800k triples, counting subjects
    # with an equality filter: 1 matching row 133 ms -> 114 ms, but 50,000
    # matching rows 147 ms -> 227 ms. Most checks here scan broadly, so the
    # second shape is the common one; it does not show on acme_robotics
    # because that fixture is too small for query time to dominate.
    #
    # >=0.24 for a wrong answer, not speed. Before 0.24.0 the index join
    # treated a value it had bound earlier as if the query had written it,
    # so a zero-length path between two variables -- `?a :p* ?b`, `?a :p? ?b`
    # -- matched a term the graph does not contain: `VALUES ?v { 1 } ?v :p? ?v`
    # answered one row over a graph without 1. No shipped check has that
    # shape. DAT-004's two `rdfs:subClassOf*` legs each end at a constant,
    # which keeps its zero-length meaning; a witness graph with a directly
    # typed unit, a subclass-typed unit, an untyped one, a missing one and the
    # class itself as the unit gives the same three findings on 0.23, 0.24
    # and 0.25, and pyoxigraph agrees. The floor is for checks written next.
    # 0.25's changes are to holosdb's SHACL engine, which this suite does not
    # use: SHACL is the `shacl` engine's job.
    "holosdb>=0.24",
    # The SHACL engine. Upper bound deliberate: 0.3.0 changed the default
    # meaning of sh:conforms to the specification's -- warnings and infos break
    # conformance, as they already did in pyshacl -- so a minor bump is not
    # safe to pick up unattended. See issue #4.
    # >=0.3.3 for `shacl.rdfs_closure`, which --inference rdfs now applies to
    # the graph both arms read. Against 0.3.2 the import succeeds and the call
    # raises AttributeError the first time anyone passes --inference.
    "shacl>=0.3.3,<0.4",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
    "owlrl>=6.0.2",
    "owlready2>=0.51",
]

[project.urls]
Repository = "https://github.com/pwin/consolidated-ontology-quality-suite-python"
Issues = "https://github.com/pwin/consolidated-ontology-quality-suite-python/issues"

[project.optional-dependencies]
reasoner = [
    "owlready2>=0.47",
]
# Kept so that `uv sync --extra native-shacl` and any requirements file
# carrying it are still valid. It installs nothing: `shacl` is a runtime
# dependency now, not an opt-in. Plain `uv sync` used to *uninstall* it and
# silently move the default engine back to pyshacl, which is exactly the trap
# that made it worth promoting.
native-shacl = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # Two independent engines, for the parity tests only. Neither is a runtime
    # dependency: the suite runs on holosdb and `shacl`, and these exist to
    # disagree with them when they are wrong.
    #
    #   pyoxigraph  a second SPARQL engine (tests/test_sparql_engine_parity.py)
    #               -- also what the VS Code extension ships, as oxigraph for
    #               JS, so it speaks for those users here.
    #   pyshacl     a second SHACL engine (tests/test_engine_parity_stress.py,
    #               tests/test_shacl_native_runner.py) -- it has caught real
    #               native-engine bugs, see checks/shacl_runner.py.
    "pyoxigraph>=0.5",
    "pyshacl>=0.25.0",
]

[project.scripts]
ontology-quality-suite = "ontology_suite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontology_suite"]
